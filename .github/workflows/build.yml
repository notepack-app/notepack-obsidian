name: Build

on:
  workflow_call:
  workflow_dispatch:
  pull_request:
    branches:
      - dev
  push:
    branches:
      - dev
    paths-ignore:
      - '*.md'
      - 'scripts/**'
      - '.claude/**'
      - 'manifest.json'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: build-output
          path: |
            main.js
            manifest.json
            styles.css
